spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.rapidstudy: INFO
    org.springframework.security: WARN
  file:
    name: /var/log/rapidstudy/application.log
    max-size: 10MB
    max-history: 30

# Production-specific settings
server:
  error:
    include-stacktrace: never
    include-message: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
