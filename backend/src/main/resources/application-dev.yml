spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rapidstudy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  devtools:
    restart:
      enabled: true

logging:
  level:
    root: INFO
    com.rapidstudy: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

# Development-specific settings
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001