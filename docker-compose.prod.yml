version: "3.9"

# ── Production Docker Compose ────────────────────────────────────────────────
# Poora stack: Nginx + Backend + Frontend + MySQL + Redis
# Run: docker compose -f docker-compose.prod.yml up -d

services:
  # ── Nginx (reverse proxy + static frontend) ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: rapidstudy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - frontend_build:/var/www/frontend:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Spring Boot Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rapidstudy-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST:      mysql
      DB_PORT:      3306
      DB_NAME:      ${DB_NAME:-rapidstudy}
      DB_USERNAME:  ${DB_USERNAME:-rapidstudy_user}
      DB_PASSWORD:  ${DB_PASSWORD}
      DB_SSL:       false
      REDIS_HOST:   redis
      REDIS_PORT:   6379
      JWT_SECRET:   ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost}
      AI_ENABLED:   ${AI_ENABLED:-false}
      AI_API_KEY:   ${AI_API_KEY:-}
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── MySQL 8 ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: rapidstudy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME:-rapidstudy}
      MYSQL_USER:          ${DB_USERNAME:-rapidstudy_user}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"  # External expose nahi — sirf internal network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rapidstudy-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    expose:
      - "6379"  # External expose nahi
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  mysql_data:    driver: local
  redis_data:    driver: local
  frontend_build: driver: local

networks:
  default:
    name: rapidstudy-prod-network
